services:
  mongodb:
    image: mongo:7
    container_name: contratos_mongodb
    restart: unless-stopped
    ports:
      # Solo accesible desde esta máquina
      - "127.0.0.1:27017:27017"
    environment:
      # Credenciales en el .env de la raíz (ver .env.example)
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Falta MONGO_ROOT_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Falta MONGO_ROOT_PASSWORD en .env}
      MONGO_INITDB_DATABASE: contratos_db
    volumes:
      - mongodb_data:/data/db

  backend-info:
    build: ./backend-info
    container_name: contratos_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/contratos_db?authSource=admin
      MONGODB_DB_NAME: contratos_db
    env_file:
      - ./backend-info/.env
    depends_on:
      - mongodb
    volumes:
      - ./backend-info:/app

  n8n:
    image: n8nio/n8n:latest
    container_name: contratos_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      WEBHOOK_URL: http://localhost:5678
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      # Debe coincidir con N8N_WEBHOOK_SECRET de backend-info/.env
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
      # El workflow lee el secret con $env
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows

volumes:
  mongodb_data:
  n8n_data:
