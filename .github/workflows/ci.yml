name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se pushea de nuevo a la misma rama, se cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, tipos y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Valores de mentira: el build solo necesita que existan
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build de producción
        run: npm run build

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (instalación y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-info
    env:
      OPENAI_API_KEY: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Misma versión que el Dockerfile
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-info/requirements*.txt

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Verificar que la app arranca
        run: python -c "from app.main import app; print('Rutas:', len(app.routes))"

      - name: Tests
        run: |
          if [ -d tests ]; then
            python -m pytest -v
          else
            echo "Todavía no hay tests"
          fi
